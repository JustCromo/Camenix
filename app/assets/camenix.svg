<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Camenix">
  <!-- Camenix: camaleonte geometrico provvisorio (il logo ufficiale lo sostituirà) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EE3A8"/>
      <stop offset="1" stop-color="#3FB37F"/>
    </linearGradient>
  </defs>
  <!-- coda a spirale -->
  <path d="M40 92 C 22 96, 16 112, 30 116 C 42 119, 46 106, 37 103" fill="none" stroke="#3FB37F" stroke-width="7" stroke-linecap="round"/>
  <!-- corpo a sfaccettature -->
  <path d="M30 88 L44 56 L74 44 L104 56 L114 76 L96 92 L60 96 Z" fill="url(#g)"/>
  <path d="M44 56 L74 44 L64 72 Z" fill="#B9A6F5"/>
  <path d="M74 44 L104 56 L84 72 Z" fill="#FFD25A"/>
  <path d="M30 88 L60 96 L52 74 Z" fill="#FF8FB8"/>
  <path d="M64 72 L84 72 L96 92 L60 96 Z" fill="#2FA06C" opacity="0.55"/>
  <!-- cresta -->
  <path d="M74 44 L80 30 L90 47 Z" fill="#E8892A"/>
  <!-- occhio a torretta -->
  <circle cx="98" cy="66" r="11" fill="#1E1528"/>
  <circle cx="98" cy="66" r="11" fill="none" stroke="#FFF4DA" stroke-width="3"/>
  <circle cx="101" cy="63" r="3.2" fill="#FFFFFF"/>
  <!-- zampe -->
  <path d="M50 94 L46 106 M80 94 L84 106" stroke="#3FB37F" stroke-width="6" stroke-linecap="round"/>
</svg>
